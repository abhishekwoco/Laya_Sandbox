# Alembic CLI config for laya-mcp. Migrations live inside the package
# (src/laya_mcp/db/migrations) so they ship with it; the server applies them at startup via
# Repo.migrate(). Use this file for development, e.g. from the project root:
#   venv\Scripts\alembic.exe revision --autogenerate -m "add column"
#   venv\Scripts\alembic.exe upgrade head
# The database URL comes from Settings (LAYA_MCP_DATA_DIR, default ./data) unless
# sqlalchemy.url is set below.

[alembic]
script_location = %(here)s/src/laya_mcp/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# sqlalchemy.url = sqlite:///data/laya_mcp.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
